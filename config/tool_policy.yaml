# Chính sách công cụ của agent hỏi đáp (plan 1.9 mục 7). Mặc định từ chối.
# Mỗi công cụ được duyệt thêm một dòng ở cong_cu và cho_phep của từng vai trò.
# Luồng cũ cứng không còn là công cụ: đường lui là cờ ask.engine: co_dinh trong config/settings.yaml.
mac_dinh: tu_choi
cong_cu:
  tra_tuong_tac:
    bat: true
  tim_doan_nguon:
    bat: true
  doc_doan_mo_rong:
    bat: true
  tra_thuoc:
    bat: true
  tinh_chi_so:
    bat: true
  lay_du_lieu_ca:
    bat: true
  ve_bieu_do:
    bat: true
vai_tro:
  duoc_si_ls:
    cho_phep: [tra_tuong_tac, tim_doan_nguon, doc_doan_mo_rong, tra_thuoc, tinh_chi_so, lay_du_lieu_ca, ve_bieu_do]
  admin:
    cho_phep: [tra_tuong_tac, tim_doan_nguon, doc_doan_mo_rong, tra_thuoc, tinh_chi_so, lay_du_lieu_ca, ve_bieu_do]
che_do:
  chung:
    cam: [tinh_chi_so, lay_du_lieu_ca, ve_bieu_do]
