# Danh mục công thức lâm sàng (chưa được dược sĩ phê duyệt).
# Loại công thức: cong_thuc_toan | thang_diem | diem_ra_nguy_co | tieu_chi_van_ban | tinh_lieu

- ma: bmi
  ten: Chỉ số khối cơ thể (BMI)
  loai: cong_thuc_toan
  ham: app.calc.body.bmi
  dau_ra: {don_vi: kg/m2}
  dau_vao:
    - {ten: can_nang_kg, don_vi: [kg], nguon_trong_ca: "sinh_hieu: can_nang"}
    - {ten: chieu_cao_cm, don_vi: [cm], nguon_trong_ca: "sinh_hieu: chieu_cao (nếu ca chưa có thì báo thiếu)"}
  tham_khao_goc: ["WHO. Body mass index (BMI)."]
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/29
  trang_thai: chua_duoc_si_duyet

- ma: bsa_mosteller
  ten: Diện tích da cơ thể (BSA) – Mosteller
  loai: cong_thuc_toan
  ham: app.calc.body.bsa_mosteller
  dau_ra: {don_vi: m2}
  dau_vao:
    - {ten: can_nang_kg, don_vi: [kg], nguon_trong_ca: "sinh_hieu: can_nang"}
    - {ten: chieu_cao_cm, don_vi: [cm], nguon_trong_ca: "sinh_hieu: chieu_cao (nếu ca chưa có thì báo thiếu)"}
  tham_khao_goc: ["Mosteller RD. N Engl J Med 1987;317:1098."]
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/29
  trang_thai: chua_duoc_si_duyet

- ma: bsa_dubois
  ten: Diện tích da cơ thể (BSA) – Du Bois
  loai: cong_thuc_toan
  ham: app.calc.body.bsa_dubois
  dau_ra: {don_vi: m2}
  dau_vao:
    - {ten: can_nang_kg, don_vi: [kg], nguon_trong_ca: "sinh_hieu: can_nang"}
    - {ten: chieu_cao_cm, don_vi: [cm], nguon_trong_ca: "sinh_hieu: chieu_cao (nếu ca chưa có thì báo thiếu)"}
  tham_khao_goc: ["Du Bois D, Du Bois EF. Arch Intern Med 1916;17:863-871."]
  tham_chieu_mdcalc: null
