- ma: calcium_corrected
  ten: Canxi toàn phần hiệu chỉnh theo albumin
  loai: cong_thuc_toan
  ham: app.calc.electrolyte.calcium_corrected
  dau_ra: {don_vi: [mg/dL, mmol/L]}
  dau_vao:
    - {ten: canxi, don_vi: [mg/dL, mmol/L], nguon_trong_ca: "chưa có trường trong CaBenh"}
    - {ten: albumin, don_vi: [g/dL, g/L], nguon_trong_ca: "chưa có trường trong CaBenh"}
    - {ten: albumin_binh_thuong, don_vi: [g/dL], mac_dinh: 4.0, nguon_trong_ca: "tham số tham chiếu (mặc định 4.0 g/dL)"}
  tham_khao_goc: ["Payne RB, Little AJ, Williams RB, Milner JR. Interpretation of serum calcium in patients with abnormal serum proteins. BMJ 1973;4(5893):643-6."]
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/31
  trang_thai: chua_duoc_si_duyet
