- ma: ibw_devine
  ten: Cân nặng lý tưởng (IBW) – Devine
  loai: cong_thuc_toan
  ham: app.calc.body.ibw_devine
  dau_ra: {don_vi: kg}
  dau_vao:
    - {ten: gioi_tinh, kieu: lua_chon, gia_tri: [nam, nu], nguon_trong_ca: "nguoi_benh.gioi_tinh"}
    - {ten: chieu_cao_cm, don_vi: [cm], nguon_trong_ca: "sinh_hieu: chieu_cao (nếu ca chưa có thì báo thiếu)"}
  tham_khao_goc: ["Devine BJ. Drug Intell Clin Pharm 1974;8:650-655."]
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/68
  trang_thai: chua_duoc_si_duyet

- ma: adjusted_body_weight
  ten: Cân nặng hiệu chỉnh (AdjBW)
  loai: cong_thuc_toan
  ham: app.calc.body.adjusted_body_weight
  dau_ra: {don_vi: kg}
  dau_vao:
    - {ten: gioi_tinh, kieu: lua_chon, gia_tri: [nam, nu], nguon_trong_ca: "nguoi_benh.gioi_tinh"}
    - {ten: chieu_cao_cm, don_vi: [cm], nguon_trong_ca: "sinh_hieu: chieu_cao (nếu ca chưa có thì báo thiếu)"}
    - {ten: can_nang_kg, don_vi: [kg], nguon_trong_ca: "sinh_hieu: can_nang"}
  tham_khao_goc: ["Bauer LA. Applied Clinical Pharmacokinetics. Hệ số hiệu chỉnh 0.4."]
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/68
  trang_thai: chua_duoc_si_duyet

- ma: cockcroft_gault
  ten: Độ thanh thải creatinin (CrCl) – Cockcroft-Gault
  loai: cong_thuc_toan
  ham: app.calc.renal.cockcroft_gault
  dau_ra: {don_vi: mL/min}
  dau_vao:
    - {ten: tuoi, don_vi: [tuoi], nguon_trong_ca: "nguoi_benh.tuoi"}
    - {ten: gioi_tinh, kieu: lua_chon, gia_tri: [nam, nu], nguon_trong_ca: "nguoi_benh.gioi_tinh"}
    - {ten: can_nang_kg, don_vi: [kg], nguon_trong_ca: "sinh_hieu: can_nang"}
    - {ten: creatinin, don_vi: [mg/dL, umol/L], nguon_trong_ca: "xet_nghiem: creatinin"}
    - {ten: loai_can_nang, kieu: lua_chon, gia_tri: [thuc_te, ly_tuong, hieu_chinh], mac_dinh: thuc_te, nguon_trong_ca: "tham số chọn cách tính (mặc định thuc_te)"}
    - {ten: chieu_cao_cm, don_vi: [cm], bat_buoc: false, nguon_trong_ca: "sinh_hieu: chieu_cao (cần khi dùng ly_tuong hoặc hieu_chinh)"}
  tham_khao_goc: ["Cockcroft DW, Gault MH. Nephron 1976;16:31-41."]
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/43
  trang_thai: chua_duoc_si_duyet

- ma: egfr_ckd_epi_2021
  ten: Mức lọc cầu thận ước tính (eGFR) – CKD-EPI 2021
  loai: cong_thuc_toan
  ham: app.calc.renal.egfr_ckd_epi_2021
  dau_ra: {don_vi: mL/min/1.73m2}
  dau_vao:
    - {ten: tuoi, don_vi: [tuoi], nguon_trong_ca: "nguoi_benh.tuoi"}
    - {ten: gioi_tinh, kieu: lua_chon, gia_tri: [nam, nu], nguon_trong_ca: "nguoi_benh.gioi_tinh"}
    - {ten: creatinin, don_vi: [mg/dL, umol/L], nguon_trong_ca: "xet_nghiem: creatinin"}
  tham_khao_goc: ["Inker LA, et al. N Engl J Med 2021;385:1737-1749."]
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/3939
  trang_thai: chua_duoc_si_duyet

- ma: child_pugh
  ten: Child-Pugh
  loai: thang_diem
  ham: app.calc.hepatic.child_pugh
  dau_ra: {don_vi: diem, phan_hang: [A, B, C]}
  dau_vao:
    - {ten: bilirubin, don_vi: [mg/dL, umol/L], nguon_trong_ca: "xet_nghiem: bilirubin"}
    - {ten: albumin, don_vi: [g/dL, g/L], nguon_trong_ca: "chưa có trường trong CaBenh"}
    - {ten: inr, don_vi: [], nguon_trong_ca: "xet_nghiem: inr"}
    - {ten: co_truong, kieu: lua_chon, gia_tri: [khong, nhe, vua], nguon_trong_ca: "chưa có trường trong CaBenh"}
    - {ten: nao_gan, kieu: lua_chon, gia_tri: [khong, do_1_2, do_3_4], nguon_trong_ca: "chưa có trường trong CaBenh"}
  tham_khao_goc:
    - "Child CG, Turcotte JG. Surgery and portal hypertension. In: The liver and portal hypertension. Philadelphia: Saunders 1964:50-64."
    - "Pugh RN, Murray-Lyon IM, Dawson JL, Pietroni MC, Williams R. Transection of the oesophagus for bleeding oesophageal varices. Br J Surg 1973;60(8):646-9."
  tham_chieu_mdcalc: https://www.mdcalc.com/calc/340
  trang_thai: chua_duoc_si_duyet

