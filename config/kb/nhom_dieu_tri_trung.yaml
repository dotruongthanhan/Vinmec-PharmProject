# Chờ dược sĩ duyệt toàn bộ bảng nhóm, mức và ngoại lệ.
trang_thai: cho_duoc_si_duyet
nhom:
  - ma_nhom: ppi
    ten: PPI
    tien_to_atc: [A02BC]
    muc_do: can_luu_y
    ly_do: Phối hợp hai PPI có nguy cơ trùng tác dụng điều trị.
    nguon: phân loại ATC của WHO; mức do nhóm đề xuất, chờ dược sĩ duyệt
    ngoai_le: []
